name: Gramsrv iOS IPA
on:
  push:
    branches: [mechagram]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build iPhone IPA for re-signing
        run: |
          xcodebuild -version
          python3 - <<'PY'
          from pathlib import Path
          rules = Path("build-system/bazel-rules/rules_apple/apple/internal")
          profile = rules / "partials/provisioning_profile.bzl"
          source = profile.read_text()
          start = source.index("    if not profile_artifact:\n")
          end = source.index("    # Create intermediate file", start)
          profile.write_text(source[:start] + "    if not profile_artifact:\n        return struct(bundle_files = [])\n\n" + source[end:])
          signing = rules / "codesigning_support.bzl"
          source = signing.read_text()
          check = "        not provisioning_profile):"
          assert source.count(check) == 1
          start = source.index(check) + len(check)
          end = source.index("\ndef ", start)
          signing.write_text(source[:start] + "\n        return\n\n" + source[end:])
          PY
          if ! xcrun --sdk iphoneos --show-sdk-version | awk -F. '{exit !($1 > 27 || ($1 == 27 && $2 >= 1))}'; then
            echo 'build --@build_bazel_rules_swift//swift:copt=-DMECHAGRAM_LEGACY_IOS_SDK' >> .bazelrc
          fi
          echo 'build --//Telegram:disableProvisioningProfiles --features=disable_legacy_signing' >> .bazelrc
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("build-system/appstore-configuration.json")
          config = json.loads(path.read_text())
          config.update(bundle_id="org.tele.ram", app_specific_url_scheme="mechagram",
                        is_appstore_build="false", enable_siri=False, enable_icloud=False)
          Path("build-system/mechagram-device.json").write_text(json.dumps(config))
          PY
          python3 build-system/Make/Make.py --overrideXcodeVersion build \
            --configurationPath=build-system/mechagram-device.json \
            --xcodeManagedCodesigning \
            --configuration=release_arm64 --buildNumber="$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: yea.ipa
          path: bazel-out/**/Telegram/Telegram.ipa
          if-no-files-found: error

